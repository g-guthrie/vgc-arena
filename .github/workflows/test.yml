name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache the pinned simulator
        uses: actions/cache@v4
        with:
          path: vendor/pokemon-showdown
          key: showdown-${{ hashFiles('scripts/setup-showdown.sh') }}
      - run: npm run setup
      - run: npm test
      - run: npm run e2e
